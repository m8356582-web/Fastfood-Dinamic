<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#76513a"><title>رهگیری | Nava Food</title><link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/reset.css"><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/layout.css"><link rel="stylesheet" href="css/responsive.css"></head><body><div data-navbar data-base=""></div><main><section class="page-head"><div class="container"><h1>رهگیری سفارش</h1></div></section><section class="section" style="padding-top:10px"><div class="container"><div class="card panel" style="max-width:700px;margin:auto"><div class="row spread"><strong data-number>—</strong><span class="badge success" data-status>—</span></div><div class="stack" style="margin-top:25px" data-steps></div></div></div></section></main><div data-footer data-base=""></div><script type="module" src="js/app.js"></script><script type="module">import{getOrder,statusLabel,statusIndex}from"./js/orders/orders.js";const id=new URLSearchParams(location.search).get("id"),o=getOrder(id)||{number:id,status:"confirmed"};document.querySelector("[data-number]").textContent=o.number;document.querySelector("[data-status]").textContent=statusLabel(o.status);const a=[["confirmed","ثبت و تأیید شد"],["preparing","در حال آماده‌سازی"],["ready","آماده تحویل"],["out_for_delivery","در مسیر"],["delivered","تحویل داده شد"]],i=statusIndex(o.status);document.querySelector("[data-steps]").innerHTML=a.map((x,n)=>`<div class="card" style="padding:14px"><b>${x[1]}</b><span class="muted"> — ${n<=i?"انجام شد":"در انتظار"}</span></div>`).join("")</script></body></html>
