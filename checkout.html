<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#76513a"><title>تکمیل سفارش | Nava Food</title><link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/reset.css"><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/layout.css"><link rel="stylesheet" href="css/responsive.css"></head><body><div data-navbar data-base=""></div><main><section class="page-head"><div class="container"><h1>تکمیل سفارش</h1><p class="muted">اطلاعات لازم را وارد کنید؛ بقیه ساده است.</p></div></section><section class="section" style="padding-top:10px"><div class="container"><form class="checkout-grid" data-checkout><div class="stack"><div class="card panel"><h2>روش دریافت</h2><label class="option-item"><span><input type="radio" name="orderType" value="delivery" checked> ارسال</span><span>۳۵,۰۰۰ تومان</span></label><label class="option-item"><span><input type="radio" name="orderType" value="pickup"> دریافت حضوری</span><span>رایگان</span></label></div><div class="card panel"><h2>آدرس</h2><textarea class="textarea" name="address" placeholder="آدرس کامل"></textarea></div><div class="card panel"><h2>پرداخت</h2><label class="option-item"><span><input type="radio" name="paymentMethod" value="online" checked> پرداخت آنلاین</span></label><label class="option-item"><span><input type="radio" name="paymentMethod" value="cash"> هنگام تحویل</span></label></div></div><aside class="card panel"><h2>سفارش شما</h2><div data-items></div><div class="field"><label>تخفیف</label><input class="input" name="discount" type="number" min="0" value="0"></div><div class="summary-line"><span>جمع</span><b data-subtotal>—</b></div><div class="summary-line"><span>ارسال</span><b data-shipping>—</b></div><div class="summary-total"><div class="summary-line"><span>نهایی</span><b data-total>—</b></div></div><button class="btn btn-primary" style="width:100%" type="submit">ثبت و ادامه</button></aside></form></div></section></main><div data-footer data-base=""></div><script type="module" src="js/app.js"></script><script type="module" src="js/checkout/checkout.js"></script></body></html>
