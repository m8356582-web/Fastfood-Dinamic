<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#76513a"><title>سفارش‌های من | Nava Food</title><link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/reset.css"><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/layout.css"><link rel="stylesheet" href="css/responsive.css"></head><body><div data-navbar data-base=""></div><main><section class="page-head"><div class="container"><h1>سفارش‌های من</h1></div></section><section class="section" style="padding-top:10px"><div class="container account-layout"><aside class="card account-nav"><a href="profile.html">پروفایل</a><a href="orders.html">سفارش‌ها</a><a href="addresses.html">آدرس‌ها</a></aside><div class="stack" data-orders></div></div></section></main><div data-footer data-base=""></div><script type="module" src="js/app.js"></script><script type="module">import{getOrders,statusLabel}from"../js/orders/orders.js";import{formatPrice,formatDate}from"../js/utils/format.js";const r=document.querySelector("[data-orders]"),x=getOrders();r.innerHTML=x.length?x.map(o=>`<div class="card panel"><div class="row spread"><b>${o.number}</b><span class="badge">${statusLabel(o.status)}</span></div><p class="muted">${formatDate(o.createdAt)}</p><div class="row spread"><b>${formatPrice(o.total)}</b><a class="btn btn-secondary" href="../track-order.html?id=${o.id}">رهگیری</a></div></div>`).join(""):`<div class="card panel muted">هنوز سفارشی ندارید.</div>`</script></body></html>
